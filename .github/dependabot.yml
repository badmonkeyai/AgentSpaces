# Supply-chain updates (security remediation plan §12 / ASF-018): keep the
# Maven tree and the pinned GitHub Actions current (the two clients are standalone
# projects outside this repository). Version
# bumps that would break the Debian-system-repo build documented in
# docs/BUILD-ENVIRONMENTS.md are reviewed, not auto-merged.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the default GITHUB_TOKEN (ASF-039): the build only reads.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify
        # env.CI activates the coverage profile and the spring-it profile, so
        # this run includes the real-Spring integration test (the release gate
        # for the starter; see docs/BUILD-ENVIRONMENTS.md).
        run: mvn -B -ntp verify

  # The non-JVM clients (agentspaces-python, agentspaces-typescript) and the
  # flagships are standalone projects beside this repository, not in it; the
  # cross-language conformance gate runs here through the Java golden-vector
  # tests against tools/golden/golden.json, and the workspace's verify-all.sh
  # runs the client suites and the standalone projects against the installed
  # libraries (remediation plan WS1/WS7, QA4 A4-2).

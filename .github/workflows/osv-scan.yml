# Known-vulnerability scan over every dependency manifest (security
# remediation plan §12 / ASF-018), on each PR and on a weekly schedule so
# advisories published after a merge still surface.
name: osv-scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The scanner cannot resolve the reactor's pom.xml files (the sibling
      # modules are not on Maven Central): it either fails outright or falls back
      # to the declared dependencies alone and misses every transitive one. So
      # Maven resolves the tree and the scanner reads that, as an SBOM. env.CI
      # activates the spring-it profile, so the integration tests' Spring tree
      # is in it too.
      - name: Resolve the dependency tree as an SBOM
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: OSV scan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: -L target/bom.cdx.json

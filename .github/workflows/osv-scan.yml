# Known-vulnerability scan over every dependency manifest (security
# remediation plan §12 / ASF-018), on each PR and on a weekly schedule so
# advisories published after a merge still surface.
name: osv-scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: OSV scan
        uses: google/osv-scanner-action/osv-scanner-action@9bb69575e74019c2ad085a1860787043adf47ccb # v2.2.4
        with:
          scan-args: --recursive .

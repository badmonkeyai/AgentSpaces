\* Clocks up to twice the grace apart, as MAX_DRIFT (10 min) is twice the grace (5 min). With the drift floor a
\* withdrawal keeps MAX_DRIFT, and every invariant and NoLateLive must hold (owner decision 22, per-entry-horizon.md).
SPECIFICATION Spec
CONSTANTS
    MAX_TIME = 4
    MAX_DRIFT = 2
    MAX_LEASE = 3
    GRACE = 1
    MAX_STAMP = 3
    MAX_MSGS = 1
    PER_ENTRY = TRUE
    SHORTENING = FALSE
    TWO_ISSUERS = FALSE
    DRIFT_FLOOR = TRUE
INVARIANTS
    TypeOK
    NoResurrection
    RefusedAtEveryDoor
    LeaseBound
PROPERTIES
    NoLateLive
CHECK_DEADLOCK FALSE

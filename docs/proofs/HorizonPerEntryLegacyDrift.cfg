\* The legacy rule with 2 x maxLease shorter than the drift, as two 1-minute leases are against MAX_DRIFT's ten minutes.
\* With the drift floor a withdrawal keeps MAX_DRIFT, and every invariant and NoLateLive must hold.
SPECIFICATION Spec
CONSTANTS
    MAX_TIME = 4
    MAX_DRIFT = 3
    MAX_LEASE = 1
    GRACE = 1
    MAX_STAMP = 3
    MAX_MSGS = 1
    PER_ENTRY = FALSE
    SHORTENING = FALSE
    TWO_ISSUERS = FALSE
    DRIFT_FLOOR = TRUE
INVARIANTS
    TypeOK
    NoResurrection
    RefusedAtEveryDoor
    LeaseBound
PROPERTIES
    NoLateLive
CHECK_DEADLOCK FALSE

\* Two copies in flight, so deliveries reorder; a renewed entry is collected with an older copy still in flight.
\* Every invariant and NoLateLive must hold.
SPECIFICATION Spec
CONSTANTS
    MAX_TIME = 3
    MAX_DRIFT = 1
    MAX_LEASE = 2
    GRACE = 1
    MAX_STAMP = 3
    MAX_MSGS = 2
    PER_ENTRY = TRUE
    SHORTENING = FALSE
    TWO_ISSUERS = FALSE
    DRIFT_FLOOR = TRUE
INVARIANTS
    TypeOK
    NoResurrection
    RefusedAtEveryDoor
    LeaseBound
PROPERTIES
    NoLateLive
CHECK_DEADLOCK FALSE
